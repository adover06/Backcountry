services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backcountry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backcountry}
      POSTGRES_DB: ${POSTGRES_DB:-backcountry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backcountry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-backcountry}:${POSTGRES_PASSWORD:-backcountry}@postgres:5432/${POSTGRES_DB:-backcountry}
      STORAGE_ROOT: /var/lib/backcountry/gpx
      # Frontend + API share an origin behind the tunnel, so the only origin we
      # need to allow is the public Cloudflare URL (for safety, even though same-origin
      # requests don't trip CORS).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://your.tunnel.hostname}
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # AI situation brief. Set OPENAI_API_KEY to use OpenAI; otherwise it falls
      # back to OLLAMA_BASE_URL/OLLAMA_MODEL (and degrades quietly if unreachable).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      AIRNOW_API_KEY: ${AIRNOW_API_KEY:-}
      FIRE_CACHE_TTL_SECONDS: ${FIRE_CACHE_TTL_SECONDS:-21600}
      SNOW_CACHE_TTL_SECONDS: ${SNOW_CACHE_TTL_SECONDS:-3600}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-1800}
      AQI_CACHE_TTL_SECONDS: ${AQI_CACHE_TTL_SECONDS:-1800}
      FIRE_HISTORY_DAYS: ${FIRE_HISTORY_DAYS:-365}
      TRAILS_SOURCE: ${TRAILS_SOURCE:-/data/trails.geojson}
    volumes:
      - gpxdata:/var/lib/backcountry/gpx
      - ${TRAILS_FILE:-./data/trails.geojson}:/data/trails.geojson:ro
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./data/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    # No host port published — frontend nginx talks to backend over the docker network.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6767/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty VITE_API_BASE means "same origin" — the SPA calls /api/... and
        # frontend nginx proxies to the backend container. No CORS needed.
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      # Internal app network: reach the backend container by name.
      default: {}
      # External network shared with the Cloudflare Tunnel. Point the tunnel's
      # service URL at http://backcountry:80 (the alias below).
      proxy:
        aliases:
          - backcountry
    # Host port no longer required for the tunnel (it reaches us over `proxy`),
    # but kept for local debugging. Remove this block to stop publishing 8088.
    ports:
      - "${PUBLIC_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Pre-existing network your Cloudflare Tunnel container is attached to.
  proxy:
    external: true
    name: proxy

volumes:
  pgdata:
  gpxdata:
