# Frontend nginx: serves the SPA AND proxies /api/* to the backend container.
# The Cloudflare Tunnel terminates TLS upstream; we just speak http here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GPX uploads can be a few MB; raise the default 1m limit.
    client_max_body_size 25m;

    # API → backend service on the docker network.
    location /api/ {
        proxy_pass http://backend:6767;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable buffering for SSE / streaming endpoints if you add any.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Long cache for hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
